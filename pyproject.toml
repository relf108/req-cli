[project]
name = "req-cli"
version = "0.4.0"
description = "Generate and send saved API requests from OpenAPI specs via a lazygit-style TUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "textual>=1.0",
  "requests>=2.32",
  "pyyaml>=6.0",
  "openapi-pydantic>=0.5",
  "tomli-w>=1.0",
]

[project.scripts]
req = "req_cli.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-requests",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/req_cli"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
ignore = [
  "B008",
  "D202",
  "D203",
  "D211",
  "D212",
  "TC001",
  "TC003",
  "TD003",
  "S101",
  "G004",
]
select = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# tests: no docstring/annotation ceremony, magic values and unused fixture args are idiomatic
"tests/*" = ["D", "ANN", "ARG", "PLR2004"]
# headless CLI: print IS the interface
"src/req_cli/__main__.py" = ["T201"]
# spec nodes are unions across openapi-pydantic 3.0/3.1 model sets; JSON values are Any by nature
"src/req_cli/gen/openapi.py" = ["ANN401"]
"src/req_cli/gen/generate.py" = ["ANN401"]
# cooperative-mixin pass-through __init__ and heterogeneous search matches (TreeNode | int)
"src/req_cli/tui/vim.py" = ["ANN401"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["req_cli"]

[[tool.mypy.overrides]]
module = "req_cli.tui.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=req_cli --cov-report=term-missing"
asyncio_mode = "auto"
